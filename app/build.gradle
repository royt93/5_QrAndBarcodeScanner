plugins {
//    id("io.sentry.android.gradle") version "3.0.1"
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
}

//sentry {
//    includeProguardMapping = true
//    autoUploadProguardMapping = true
//}

// VIP secret/public-key đọc từ local.properties (gitignored) — KHÔNG dùng gradle.properties, file đó
// đang bị track trong git (đã có RELEASE_STORE_PASSWORD lộ sẵn trong history, xem cảnh báo báo cáo).
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    compileSdkVersion 37
    namespace "com.mckimquyen.barcodescanner"
    defaultConfig {
        applicationId "com.mckimquyen.barcodescanner"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 20260817
        versionName "2026.08.17"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.incremental": "true"]
            }
        }

        buildConfigField "boolean", "ERROR_REPORTS_ENABLED_BY_DEFAULT", "true"
        manifestPlaceholders = [applovin_sdk_key: "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11.toString()
        targetCompatibility = JavaVersion.VERSION_11.toString()
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/rxjava.properties']
        }
    }

    signingConfigs {
        release {
            storeFile file(localProps.getProperty("RELEASE_STORE_FILE"))
            storePassword localProps.getProperty("RELEASE_STORE_PASSWORD")
            keyAlias localProps.getProperty("RELEASE_KEY_ALIAS")
            keyPassword localProps.getProperty("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            // Provider: AdMob (IS_ENABLE_ADMOB=true) — AppLovin kept wired as fallback/comparison per plan (doc/AD.MD).
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "true"
            buildConfigField "String", "APPLOVIN_SDK_KEY", "\"e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt\""
            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"1cfc3df1cd94473a\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"2f81cf4ca355cdac\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"5baea98f19f13cf2\""
            buildConfigField "String", "APPLOVIN_REWARD_ID", "\"260b02ff9724a4ec\""

            // ⚠️ Google TEST ad unit IDs — user xác nhận dùng test ID để build/QA trước, SẼ thay bằng ID
            // production thật của app trước khi release (xem doc/AD.MD mục 6.1). KHÔNG ship debug test ID
            // này lên bản release.
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3940256099942544/9257395921\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-3940256099942544/5224354917\""

            buildConfigField "String", "VIP_KEY_SECRET", "\"${localProps.getProperty('VIP_KEY_SECRET', '')}\""
            buildConfigField "String", "VIP_TOKEN_PUBLIC_KEY", "\"${localProps.getProperty('VIP_TOKEN_PUBLIC_KEY', '')}\""
        }
        release {
            // Provider: AdMob (IS_ENABLE_ADMOB=true) — AppLovin kept wired as fallback/comparison per plan (doc/AD.MD).
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "true"
            buildConfigField "String", "APPLOVIN_SDK_KEY", "\"e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt\""
            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"1cfc3df1cd94473a\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"2f81cf4ca355cdac\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"5baea98f19f13cf2\""
            buildConfigField "String", "APPLOVIN_REWARD_ID", "\"260b02ff9724a4ec\""

            // 🚨 VẪN LÀ TEST ID — chờ user cấp 4 ad unit ID production thật (doc/AD.MD mục 6.1) rồi thay
            // trước khi build release thật. Build release hiện tại CHỈ dùng để build/QA nội bộ.
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3940256099942544/9257395921\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-3940256099942544/5224354917\""

            buildConfigField "String", "VIP_KEY_SECRET", "\"${localProps.getProperty('VIP_KEY_SECRET', '')}\""
            buildConfigField "String", "VIP_TOKEN_PUBLIC_KEY", "\"${localProps.getProperty('VIP_TOKEN_PUBLIC_KEY', '')}\""

            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

//    flavorDimensions.add("market")
    flavorDimensions.add("type")
    productFlavors {
        dev {
            buildConfigField "Boolean", "build_debug", "true"
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"dev"')
        }
        production {
            buildConfigField "Boolean", "build_debug", "false"
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"prod"')
        }
    }

    buildFeatures {
//        compose = true
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    api "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    api 'androidx.core:core-ktx:1.18.0'
    api 'androidx.appcompat:appcompat:1.8.0'
    api 'com.google.android.material:material:1.14.0'
    api 'androidx.constraintlayout:constraintlayout:2.2.2'
    api 'androidx.print:print:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    //noinspection KaptUsageInsteadOfKsp
    kapt "androidx.room:room-compiler:2.8.4"
    api "androidx.room:room-runtime:2.8.4"
    api "androidx.room:room-rxjava3:2.8.4"
    api "androidx.room:room-paging:2.8.4"
    api "androidx.paging:paging-runtime-ktx:3.5.1"
    api "androidx.paging:paging-rxjava3:3.5.1"
//    api 'com.budiyev.android:code-scanner:2.1.2'
    api 'com.github.yuriy-budiyev:code-scanner:2.3.2'
    api 'com.journeyapps:zxing-android-embedded:4.3.0'
    api 'com.googlecode.ez-vcard:ez-vcard:0.12.1'
    api "commons-codec:commons-codec:1.16.0"
    api "dev.turingcomplete:kotlin-onetimepassword:2.0.1"
    api "io.reactivex.rxjava3:rxkotlin:3.0.1"
    api "io.reactivex.rxjava3:rxjava:3.1.10"
    api "com.jakewharton.rxbinding4:rxbinding:4.0.0"
    api "com.github.akarnokd:rxjava3-interop:3.0.0"
//    api 'com.isseiaoki:simplecropview:1.1.8'
    api 'com.github.igreenwood:SimpleCropView:v1.1.6'
//    api 'com.github.florent37:singledateandtimepicker:2.2.6'
    api 'com.github.florent37:singledateandtimepicker:2.2.7'
    implementation("com.github.royt93:AdmobApplovinWrapper:1.6.16")
    implementation("com.google.android.play:review:2.0.2")
    implementation("com.google.android.play:review-ktx:2.0.2")
    implementation("androidx.lifecycle:lifecycle-process:2.11.0")
    implementation("nl.dionsegijn:konfetti-xml:2.0.5") // VIP screen success confetti (UI mirrors SDK's own reference demo)

    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.7.0"
    androidTestImplementation "androidx.fragment:fragment-testing:1.9.0"
    debugImplementation "androidx.fragment:fragment-testing-manifest:1.9.0"
}
